<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LVO Jobs Board · Workforce Network</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
  <script>if ('scrollRestoration' in history) history.scrollRestoration = 'manual';</script>
  <style>
:root{--accent:#9C7A3C}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --red:#8B0000;--red-hi:#B01E1E;
  --chrome:#3A392F;--white:#16181C;
  --dim:#726F63;--bg:#FAF8F4;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--white);font-family:'Cormorant Garamond',Georgia,serif;overflow-x:hidden;cursor:default}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.025;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.page{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

/* GATE VEIL — covers everything until auth is confirmed, prevents any content flash */
#gateVeil{position:fixed;inset:0;z-index:10000;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.2rem;transition:opacity .5s ease}
#gateVeil.hide{opacity:0;pointer-events:none}
.veil-mark{font-family:'Cinzel',serif;font-size:.85rem;font-weight:600;letter-spacing:.35em;color:var(--accent);text-transform:uppercase}
.veil-status{font-family:'Cinzel',serif;font-size:.5rem;letter-spacing:.3em;color:var(--dim);text-transform:uppercase}
.veil-spinner{width:22px;height:22px;border:.5px solid color-mix(in srgb,var(--accent) 35%,transparent);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Content is hidden by default; only revealed once access is confirmed */
#content{display:none}
#content.show{display:block}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:200;padding:1.8rem 4rem;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(to bottom,rgba(250,248,244,.97),transparent)}
.nav-left{display:flex;flex-direction:column;gap:.2rem}
.nav-parent{font-family:'Cinzel',serif;font-size:.48rem;letter-spacing:.35em;color:var(--red-hi);text-decoration:none;text-transform:uppercase;transition:color .3s}
.nav-parent:hover{color:var(--chrome)}
.nav-mark{font-family:'Cinzel',serif;font-size:.95rem;font-weight:600;letter-spacing:.3em;color:var(--accent);text-decoration:none}
.nav-right{display:flex;align-items:center;gap:1.5rem}
.nav-tag{font-family:'Cinzel',serif;font-size:.52rem;letter-spacing:.25em;color:var(--dim);text-transform:uppercase}
#navUserBtn{display:flex;align-items:center;gap:1rem}

/* HERO */
.hero{min-height:60vh;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;padding:9rem 4rem 3rem;position:relative}
.hero::before{content:'';position:absolute;top:50%;left:15%;transform:translate(-50%,-50%);width:min(600px,90vw);height:min(600px,90vw);border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,color-mix(in srgb,var(--accent) 10%,transparent) 0%,transparent 70%)}
.hero-label{font-family:'Cinzel',serif;font-size:.52rem;letter-spacing:.5em;color:var(--red-hi);text-transform:uppercase;margin-bottom:1.5rem;opacity:0;animation:fadeUp 1s cubic-bezier(.16,1,.3,1) .3s forwards}
.hero-title{font-family:'Cinzel',serif;font-size:clamp(2rem,7vw,4rem);font-weight:900;letter-spacing:.2em;color:var(--accent);line-height:1;margin-bottom:.5rem;opacity:0;animation:fadeUp 1s cubic-bezier(.16,1,.3,1) .5s forwards}
.hero-sub{font-family:'Cinzel',serif;font-size:clamp(.48rem,1.5vw,.65rem);letter-spacing:.4em;color:var(--dim);text-transform:uppercase;margin-bottom:1.5rem;opacity:0;animation:fadeUp 1s cubic-bezier(.16,1,.3,1) .7s forwards}
.hero-rule{width:60px;height:1px;background:linear-gradient(to right,var(--accent),transparent);margin:2.5rem 0 0;opacity:0;animation:fadeIn 1s ease 1.1s forwards}

/* FILTER BAR */
.filter-wrap{max-width:1000px;margin:0 auto;padding:0 2rem;width:100%}
.filter-bar{display:flex;gap:.8rem;flex-wrap:wrap;margin-bottom:3rem}
.filter-chip{font-family:'Cinzel',serif;font-size:.48rem;letter-spacing:.25em;text-transform:uppercase;color:var(--dim);border:.5px solid color-mix(in srgb,var(--accent) 35%,transparent);padding:.55rem 1.1rem;background:transparent;cursor:pointer;transition:all .25s}
.filter-chip:hover{color:var(--chrome);border-color:var(--accent)}
.filter-chip.active{color:var(--accent);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}

/* JOBS LIST */
.jobs-wrap{max-width:1000px;margin:0 auto;padding:0 2rem 6rem;width:100%;display:flex;flex-direction:column;gap:1.2rem}
.job-card{border:.5px solid color-mix(in srgb,var(--accent) 25%,transparent);background:color-mix(in srgb,var(--accent) 3%,transparent);padding:1.8rem 2.2rem;display:flex;justify-content:space-between;align-items:center;gap:1.5rem;flex-wrap:wrap;transition:border-color .3s,background .3s}
.job-card:hover{border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
.job-info{display:flex;flex-direction:column;gap:.4rem}
.job-title{font-family:'Cinzel',serif;font-size:.85rem;letter-spacing:.08em;color:var(--chrome)}
.job-meta{font-size:.85rem;font-weight:300;font-style:italic;color:var(--dim)}
.job-tags{display:flex;gap:.5rem;flex-wrap:wrap}
.job-tag{font-family:'Cinzel',serif;font-size:.42rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);border:.5px solid color-mix(in srgb,var(--accent) 40%,transparent);padding:.25rem .6rem}
.job-apply{font-family:'Cinzel',serif;font-size:.5rem;letter-spacing:.3em;color:var(--accent);text-decoration:none;text-transform:uppercase;border:.5px solid var(--accent);padding:.8rem 1.4rem;white-space:nowrap;transition:background .25s,color .25s}
.job-apply:hover{background:var(--accent);color:var(--bg)}

/* EMPTY STATE */
.empty-state{border:.5px solid color-mix(in srgb,var(--accent) 30%,transparent);background:color-mix(in srgb,var(--accent) 3%,transparent);padding:4rem 2.5rem;text-align:center;position:relative}
.empty-state::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:50%;height:1px;background:linear-gradient(to right,transparent,var(--accent),transparent)}
.empty-title{font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.4em;color:var(--accent);text-transform:uppercase;margin-bottom:1rem}
.empty-text{font-size:.92rem;font-weight:300;font-style:italic;line-height:1.9;color:var(--dim);max-width:440px;margin:0 auto}

/* FOOTER */
footer{border-top:.5px solid color-mix(in srgb,var(--accent) 20%,transparent);padding:2.5rem 2rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1.2rem;margin-top:auto}
.footer-back{font-family:'Cinzel',serif;font-size:.52rem;letter-spacing:.3em;color:var(--dim);text-decoration:none;text-transform:uppercase;transition:color .3s}
.footer-back:hover{color:var(--accent)}
.footer-links{display:flex;align-items:center;gap:.9rem;font-family:'Cinzel',serif;font-size:.48rem;letter-spacing:.25em;text-transform:uppercase}
.footer-links a{color:var(--dim);text-decoration:none;transition:color .3s}
.footer-links a:hover{color:var(--accent)}
.footer-links span{color:color-mix(in srgb,var(--dim) 50%,transparent)}
.footer-copy{font-family:'Cinzel',serif;font-size:.44rem;letter-spacing:.15em;color:color-mix(in srgb,var(--dim) 55%,transparent);text-align:center;width:100%;order:3;margin-top:.4rem}

@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .9s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1)}
.reveal.visible{opacity:1;transform:translateY(0)}

.scramble-word{display:inline-block;white-space:nowrap}
.scramble-char{display:inline-block;will-change:contents}

@media(max-width:600px){
  nav{padding:1.2rem}
  .nav-tag{display:none}
  .hero{padding:7rem 1.5rem 2.5rem}
  .hero::before{left:50%}
  .job-card{padding:1.4rem 1.5rem}
  .job-apply{width:100%;text-align:center}
  footer{flex-direction:column;text-align:center;padding:2rem 1.2rem}
}

<body>

  <!-- Access veil: blocks all content until Clerk confirms a signed-in user -->
  <div id="gateVeil">
    <div class="veil-spinner"></div>
    <p class="veil-mark">𝐋𝐕𝐎 Careers</p>
    <p class="veil-status" id="veilStatus">Verifying access…</p>
  </div>

  <div class="page" id="content">

    <nav>
      <div class="nav-left">
        <a class="nav-parent" href="https://careers.wearelvo.com" data-scramble>← LVO Careers</a>
        <a class="nav-mark" href="#">Jobs Board</a>
      </div>
      <div class="nav-right">
        <span class="nav-tag" data-scramble>Open Roles &amp; Applications</span>
        <div id="navUserBtn">
          <a class="nav-dash-link" href="" id="dashLink" style="font-family:'Cinzel',serif;font-size:.48rem;letter-spacing:.3em;color:var(--accent);text-decoration:none;text-transform:uppercase;border:.5px solid color-mix(in srgb,var(--accent) 45%,transparent);padding:.35rem .75rem;transition:background .25s,border-color .25s">→ Dashboard</a>
          <div id="clerkNavBtn"></div>

    <section class="hero">

    <div class="filter-wrap reveal">

<script>
window.LVO_PAGE = {
  accent: '#9C7A3C',
  dashboardUrl: 'https://job.careers.wearelvo.com',
  signInUrl: 'https://careers.wearelvo.com'
};

/* ---- Job data ---------------------------------------------------------
   Replace/extend this array as roles open. Each job needs: title, division,
   type, location, applyUrl. Empty array renders the "no open roles" state. */
window.JOBS = [
  // { title: 'Leasing Coordinator', division: 'vindex', type: 'Full-Time', location: 'Houston, TX', applyUrl: 'https://dashboard.career.wearelvo.com/apply/xxxx' },
];

<script>
(function () {
  const { accent, dashboardUrl, signInUrl } = window.LVO_PAGE;
  const veil = document.getElementById('gateVeil');
  const veilStatus = document.getElementById('veilStatus');
  const content = document.getElementById('content');

  function goToSignIn() {
    const redirect = encodeURIComponent(window.location.href);
    window.location.replace(`${signInUrl}/?redirect_url=${redirect}`);
  }

  /* ---- Gate: nothing below runs / renders until Clerk confirms a user ---- */
  window.addEventListener('load', async () => {
    try {
      await Clerk.load();
    } catch (e) {
      veilStatus.textContent = 'Unable to verify access';
      return;
    }

    if (!Clerk.user) {
      veilStatus.textContent = 'Redirecting to sign in…';
      goToSignIn();
      return;
    }

    // Also catch sign-outs that happen while this tab is open
    Clerk.addListener(({ user }) => { if (!user) goToSignIn(); });

    unlockPage(Clerk.user);
  });

  function unlockPage(user) {
    document.getElementById('welcomeLine').textContent = `Welcome back, ${user.firstName || 'Applicant'}`;
    document.getElementById('dashLink').href = dashboardUrl;
    Clerk.mountUserButton(document.getElementById('clerkNavBtn'), {
      appearance: {
        variables: { colorPrimary: accent, borderRadius: '0px', fontFamily: "'Cormorant Garamond',Georgia,serif" },
        elements: { avatarBox: { border: `.5px solid ${accent}88`, borderRadius: '0' } }
      }
    });

    renderJobs('all');
    initFilters();

    content.classList.add('show');
    veil.classList.add('hide');
    setTimeout(() => veil.remove(), 550);

    initReveal();
    initScramble();
  }

  /* ---- Jobs rendering ---- */
  function renderJobs(filter) {
    const wrap = document.getElementById('jobsWrap');
    const jobs = (window.JOBS || []).filter((j) => filter === 'all' || j.division === filter);
    wrap.innerHTML = '';

    if (!jobs.length) {
      wrap.innerHTML = `
        <div class="empty-state">
          <p class="empty-title">No Open Roles</p>
          <p class="empty-text">There are no positions matching this filter right now. New roles are posted here as our divisions grow — check back soon, or reach out through your applicant dashboard to join the general resource pool.</p>
        </div>`;
      return;
    }

    jobs.forEach((j) => {
      const card = document.createElement('div');
      card.className = 'job-card';
      card.innerHTML = `
        <div class="job-info">
          <span class="job-title">${j.title}</span>
          <span class="job-meta">${j.type || ''}${j.type && j.location ? ' · ' : ''}${j.location || ''}</span>
          <div class="job-tags"><span class="job-tag">${(j.division || 'general').replace(/^\w/, c => c.toUpperCase())}</span></div>
        </div>
        <a class="job-apply" href="${j.applyUrl || dashboardUrl}">Apply →</a>`;
      wrap.appendChild(card);
    });
  }

  function initFilters() {
    document.getElementById('filterBar').addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-chip');
      if (!btn) return;
      document.querySelectorAll('.filter-chip').forEach((c) => c.classList.remove('active'));
      btn.classList.add('active');
      renderJobs(btn.dataset.filter);
    });
  }

  /* ---- Scroll reveal ---- */
  function initReveal() {
    document.querySelectorAll('.reveal').forEach((r) => {
      new IntersectionObserver((entries, o) => {
        entries.forEach((e) => {
          if (e.isIntersecting) { e.target.classList.add('visible'); o.unobserve(e.target); }
        });
      }, { threshold: .08 }).observe(r);
    });
  }

  /* ---- Scramble text — cursor-proximity character scramble ---- */
  function initScramble() {
    const RADIUS = 20, DURATION = 200, CHARS = 'LVOᛪ༙';

    function buildWordSpan(word) {
      const span = document.createElement('span');
      span.className = 'scramble-word';
      for (const ch of word) {
        const c = document.createElement('span');
        c.className = 'scramble-char';
        c.dataset.orig = ch;
        c.textContent = ch;
        span.appendChild(c);
      }
      return span;
    }

    function splitTextNode(node) {
      const frag = document.createDocumentFragment();
      node.textContent.split(/(\s+)/).forEach((part) => {
        if (!part) return;
        frag.appendChild(/^\s+$/.test(part) ? document.createTextNode(part) : buildWordSpan(part));
      });
      return frag;
    }

    document.querySelectorAll('[data-scramble], [data-scramble-block]').forEach((el) => {
      const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
      const nodes = [];
      let n;
      while ((n = walker.nextNode())) nodes.push(n);
      nodes.forEach((tn) => tn.textContent.trim() && tn.parentNode.replaceChild(splitTextNode(tn), tn));
    });

    const timers = new Map();
    function scrambleChar(span) {
      const orig = span.dataset.orig;
      if (!orig) return;
      if (timers.has(span)) clearInterval(timers.get(span));
      const start = performance.now();
      const id = setInterval(() => {
        const t = performance.now() - start;
        if (t < DURATION) {
          span.textContent = CHARS[Math.floor(Math.random() * CHARS.length)];
        } else {
          span.textContent = orig;
          clearInterval(id);
          timers.delete(span);
        }
      }, 33);
      timers.set(span, id);
    }

    let raf = null;
    document.addEventListener('pointermove', (e) => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = null;
        document.querySelectorAll('.scramble-char').forEach((span) => {
          const r = span.getBoundingClientRect();
          const dist = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
          if (dist < RADIUS && Math.random() < (1 - dist / RADIUS) * 0.35) scrambleChar(span);
        });
      });
    });
  }
})();
</script>
